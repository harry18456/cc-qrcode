# Every number the engine uses to accept or reject a design lives here, not in code.
# Change values here (and say so in the delivery) only when the user explicitly asks,
# or when real-device results show a threshold is too strict / too loose.

# Error budget: share of each Reed-Solomon block's correction capacity that the design itself
# may consume. The rest is reserved for real-world damage (blur, glare, dirt, perspective).
max_block_usage: 0.5
# Center of each module sampled by the ideal-decoder model (fraction of module width).
sampling_core: 0.34
# A module whose sampled luminance is within this fraction of the dark/light span from the
# threshold is counted as "at risk" (reported, not gating).
weak_margin: 0.15

# Finder patterns: allowed relative deviation from 1:1:3:1:1 on scans through the center.
# Decoders tolerate about 0.5 on horizontal/vertical scans and treat the diagonal as a looser
# secondary check. Margins beyond this are measured by the robustness sweeps.
finder_ratio_tolerance: 0.4
finder_diagonal_tolerance: 0.6

# Worst-case symbol contrast (light - dark luminance, 0..1) over several grayscale formulas.
# ISO/IEC 15415 grades symbol contrast >= 0.55 as B and >= 0.70 as A; 0.60 leaves room for print.
min_symbol_contrast: 0.60

# The central alignment pattern (versions 7-13, 21-27, 35-40) may sit under a center image.
# Tests showed no measurable loss when only that one is covered; all others stay protected.
allow_center_alignment_cover: true

# Decoders. Gating decoders must decode every accepted design; informational ones are reported.
# OpenCV rejects rounded/circular finders that phone scanners read, so it is informational.
gating_decoders: [zxing, zbar]
informational_decoders: [opencv, opencv_aruco]

# Display scales (pixels per module) at which the clean code must decode with every gating decoder.
# Some shapes fail only at particular sizes (zbar missed circular finders at 28-40 px/module),
# which the blur and downscale sweeps never reach. Screens and zoomed photos cover this whole range.
display_scales_px: [4, 6, 8, 12, 16, 20, 24, 28, 32, 40, 48]

# Robustness: each degradation axis is swept until the decoder fails; the design must keep at
# least this share of the plain (black squares on white) rendering's tolerance.
boundary_ratio:
  default: 0.7
  min_px_per_module: 0.7
  jpeg_quality: 0.6
  contrast: 0.6

# Physical size.
min_module_mm: 0.4
# Heuristic max scan distance = this factor x module size (mm) x style factor. 330 reproduces the
# common "scan distance about 10x code width" rule for small (version 2) codes and becomes more
# conservative for dense codes. It is uncalibrated, so by default it only warns; set
# distance_check: gate to make a requested print.distance_mm a hard requirement.
distance_mm_per_module_mm: 330
distance_check: warn

# Center image sizing (fraction of the symbol width, quiet zone excluded).
center:
  preferred_fraction: 0.22
  min_fraction: 0.14
  # With a center image the engine also tries up to this many larger versions: a bigger symbol has
  # room for a bigger image (checked against the print width's minimum module size).
  extra_versions: 4
